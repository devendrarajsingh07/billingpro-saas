version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    # Loads all app secrets/config (JWT_SECRET, SMTP_*, RAZORPAY_*, etc.)
    # from server/.env — copy server/.env.example to server/.env and fill
    # it in before running `docker compose up`. Without it, compose will
    # fail fast with a clear "env file not found" error instead of the
    # container crash-looping on a missing-env-var exception.
    env_file:
      - ./server/.env
    environment:
      # These are forced regardless of what's in .env, since they must
      # match this container's own network context.
      - NODE_ENV=production
      - PORT=5001
      - FRONTEND_URL=http://localhost
    volumes:
      - billing_data:/usr/src/app/database
      - billing_uploads:/usr/src/app/uploads
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/api/v1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: always

volumes:
  billing_data:
  billing_uploads:
