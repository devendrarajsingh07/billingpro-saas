name: SaaS Billing CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'server/package-lock.json'

    - name: Install server dependencies
      run: |
        cd server
        npm ci

    - name: Run require/migration verification
      run: |
        cd server
        node test_server_require.js

    - name: Run server test suite
      run: |
        cd server
        npm run test -- --passWithNoTests

  build-client:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'client/package-lock.json'

    - name: Install client dependencies
      run: |
        cd client
        npm ci

    - name: Build client bundles (Vite)
      run: |
        cd client
        npm run build
